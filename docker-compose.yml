version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-workforce-backend
    ports:
      - "8001:8001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - DATABASE_URL=sqlite:///./backend/data/platform.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NYLAS_API_KEY=${NYLAS_API_KEY}
      - NYLAS_GRANT_ID=${NYLAS_GRANT_ID}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-workforce-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    restart: unless-stopped

  # MCP Server (optional - for tool execution)
  mcp-server:
    build:
      context: .
      dockerfile: backend/Dockerfile.mcp
    container_name: ai-workforce-mcp
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NYLAS_API_KEY=${NYLAS_API_KEY}
      - NYLAS_GRANT_ID=${NYLAS_GRANT_ID}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - ./.env:/app/.env
    restart: unless-stopped

volumes:
  backend-data:

networks:
  default:
    name: ai-workforce-network
