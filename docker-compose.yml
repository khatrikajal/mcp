version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai_workforce_db
    environment:
      POSTGRES_DB: AI_Workforce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AI_Workforce"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_workforce_network

  # Redis for Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: ai_workforce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_workforce_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_workforce_api
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql://postgres:post123@db:5432/AI_Workforce
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-your-secure-jwt-secret-change-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NYLAS_API_KEY=${NYLAS_API_KEY}
      - NYLAS_GRANT_ID=${NYLAS_GRANT_ID}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_workforce_network

  # Background Task Worker
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_workforce_worker
    command: python -m backend.src.tasks.delegation_tasks --mode schedule
    environment:
      - DATABASE_URL=postgresql://postgres:post123@db:5432/AI_Workforce
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NYLAS_API_KEY=${NYLAS_API_KEY}
      - NYLAS_GRANT_ID=${NYLAS_GRANT_ID}
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - ai_workforce_network

  # MCP Server (Tool Execution)
  mcp-server:
    build:
      context: .
      dockerfile: backend/Dockerfile.mcp
    container_name: ai_workforce_mcp
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - NYLAS_API_KEY=${NYLAS_API_KEY}
      - NYLAS_GRANT_ID=${NYLAS_GRANT_ID}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - ai_workforce_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: ai_workforce_ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai_workforce_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_workforce_network:
    driver: bridge
