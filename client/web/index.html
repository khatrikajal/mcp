<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f5f7fb; color: #172033; }
    .app { width: min(900px, 100%); height: 100vh; margin: auto; display: flex; flex-direction: column; background: white; box-shadow: 0 0 40px #1f293712; }
    header { padding: 18px 22px; border-bottom: 1px solid #e7eaf0; display: flex; align-items: center; gap: 12px; }
    .logo { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: white; background: #635bff; font-weight: 800; }
    h1 { margin: 0; font-size: 17px; }
    .status { font-size: 12px; color: #657087; margin-top: 2px; }
    .status::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #22c55e; }
    #messages { flex: 1; overflow-y: auto; padding: 28px 22px; display: flex; flex-direction: column; gap: 18px; }
    .welcome { margin: auto; text-align: center; max-width: 430px; color: #657087; }
    .welcome strong { display: block; color: #172033; font-size: 22px; margin-bottom: 8px; }
    .message { max-width: 76%; line-height: 1.55; padding: 12px 15px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; color: white; background: #635bff; border-bottom-right-radius: 5px; }
    .assistant { align-self: flex-start; background: #f0f2f7; border-bottom-left-radius: 5px; }
    .tool { display: block; margin-top: 8px; font-size: 11px; color: #667085; font-weight: 600; }
    .composer { padding: 16px 22px 22px; border-top: 1px solid #e7eaf0; }
    form { display: flex; gap: 10px; padding: 8px; border: 1px solid #d9deea; border-radius: 16px; background: white; box-shadow: 0 8px 24px #1f29370a; }
    textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 9px; font: inherit; max-height: 130px; }
    button { align-self: flex-end; border: 0; border-radius: 11px; padding: 10px 18px; color: white; background: #635bff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    @media (max-width: 600px) { .message { max-width: 88%; } #messages { padding-inline: 14px; } .composer { padding-inline: 12px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="logo">M</div><div><h1>MCP Assistant</h1><div class="status">Connected to tools</div></div></header>
    <section id="messages"><div class="welcome"><strong>How can I help?</strong>Ask a general question or request live weather. The assistant will decide when to use a tool.</div></section>
    <div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Message MCP Assistant..." autofocus></textarea><button id="send">Send</button></form></div>
  </main>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const history = [];

    function addMessage(role, text, tools = []) {
      document.querySelector('.welcome')?.remove();
      const item = document.createElement('div');
      item.className = `message ${role}`;
      item.textContent = text;
      if (tools.length) {
        const badge = document.createElement('span');
        badge.className = 'tool';
        badge.textContent = `Tool used: ${tools.join(', ')}`;
        item.appendChild(badge);
      }
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = '';
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      const pending = addMessage('assistant', 'Thinking…');
      send.disabled = true;
      try {
        const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ history }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        pending.remove();
        addMessage('assistant', data.message, data.tools_used);
        history.push({ role: 'assistant', content: data.message });
      } catch (error) {
        pending.textContent = `Error: ${error.message}`;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } });
  </script>
</body>
</html>
